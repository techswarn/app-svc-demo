databases:
- cluster_name: test
  db_name: defaultdb
  db_user: doadmin
  engine: MYSQL
  name: test
  production: true
  version: "8"
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: api
    match:
      path:
        prefix: /
name: vpc-test-actions
region: blr
services:
- environment_slug: go
  envs:
  - key: DATABASE_USER
    scope: RUN_TIME
    type: SECRET
    value: ${test.USERNAME}
  - key: DATABASE_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: ${test.PASSWORD}
  - key: DATABASE_ADDR
    scope: RUN_TIME
    type: SECRET
    value: ${test.HOSTNAME}
  - key: DATABASE_DBNAME
    scope: RUN_TIME
    type: SECRET
    value: ${test.DATABASE}
  github:
    branch: main
    repo: techswarn/app-svc-demo
  http_port: 8081
  instance_count: 2
  instance_size_slug: apps-s-1vcpu-1gb
  name: api
  vpc:
    id: e29d3252-56d1-4565-8e43-98849bbc4752
